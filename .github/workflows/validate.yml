name: validate-bench
on:
  push:
    branches: [main]
  pull_request:
jobs:
  structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON and repository structure
        run: python scripts/validate_repository.py
      - name: Run executable scoring skeleton
        run: python tests/skeleton/test_score.py
